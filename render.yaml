services:
  - type: web
    name: sonicmap-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-api.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        sync: false
